schema_version = 2
policy_version = "2026.08.05"
default_profile = "default"

[execution.containers.python]
theme = "python"
capabilities = ["python", "pytest", "fastapi", "httpx", "psycopg"]
image = "sha256:d564908295dcc7e0b365f5b2ded260ef60a8ac34edf98c8ce18e8b2734f540b5"
uid = 10001
gid = 10001
warning_seconds = 30
heartbeat_seconds = 30
timeout_seconds = 900
memory_bytes = 2147483648
cpus = 2.0
pids_limit = 256
workspace_bytes = 1073741824
temp_bytes = 268435456
export_bytes = 134217728
export_entries = 10000

[reports]
root = ".harness/runs"

[rules]
core = ["governance", "development", "documentation", "testing", "security"]
modules = ["model-efficiency", "task-decomposition", "tdd"]
project_rules = ".harness/project-rules.md"

[changes]
enabled = true
target_branch = "development"
branch_prefix = "changes/"
worktree_directory = ".agent-harness-worktrees"
worktree_location = "project"
autonomous_follow_on = true
approval_mode = "goal"
goal_default_operations = ["integration", "cleanup"]
integration_profile = "default"

[changes.companion_scopes]
tests = ["tests/"]
documentation = [
  "README.md",
  "CHANGELOG.md",
  "docs/development/",
  "docs/guides/",
  "docs/reference/",
]
backlog = ["docs/TODO.md"]

[todo]
enabled = true
path = "docs/TODO.md"
format_version = 2

[test_resources.postgres]
kind = "docker-compose"
compose_file = "compose.test.yaml"
network = "test"
project_name_prefix = "story-game-tests"
startup_timeout_seconds = 60
cleanup_timeout_seconds = 10

[runners.python]
container_theme = "python"
container_capabilities = ["python", "pytest", "fastapi", "httpx", "psycopg"]
program = "{python}"
arguments = [
  "-m",
  "pytest",
  "--junitxml={junit_path}",
  "--basetemp={temp_directory}",
  "-o",
  "cache_dir={cache_directory}",
  "-o",
  "pythonpath=src",
]
affected_arguments = [
  "-m",
  "pytest",
  "--junitxml={junit_path}",
  "--basetemp={temp_directory}",
  "-o",
  "cache_dir={cache_directory}",
  "-o",
  "pythonpath=src",
  "{test_paths}",
]
working_directory = "."
result_format = "junit"
junit_required = true
network = false
external_services = false
destructive = false
filesystem_scope = "repository"

[profiles.default]
runners = ["python"]
test_resources = ["postgres"]
standard = true

[profiles.unit]
runners = ["python"]
standard = true

[selection]
fallback_paths = [
  ".harness/",
  "AGENTS.md",
  "compose.test.yaml",
  "docs/dokumentation/",
  "pyproject.toml",
]

[[selection.components]]
name = "domain"
source_paths = ["src/story_game/domain/", "tests/domain/"]
test_paths = ["tests/domain/", "tests/architecture/"]
targets = ["python"]

[[selection.components]]
name = "application"
source_paths = ["src/story_game/application/", "tests/application/"]
test_paths = ["tests/application/", "tests/architecture/"]
targets = ["python"]

[[selection.components]]
name = "api"
source_paths = ["src/story_game/api/", "tests/api/"]
test_paths = ["tests/api/", "tests/architecture/"]
targets = ["python"]

[[selection.components]]
name = "persistence"
source_paths = [
  "src/story_game/infrastructure/",
  "tests/persistence/",
]
test_paths = ["tests/persistence/", "tests/architecture/"]
targets = ["python"]
