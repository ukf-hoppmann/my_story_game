services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: story_game
      POSTGRES_USER: story_game
      POSTGRES_PASSWORD: story_game_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story_game -d story_game"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - test

networks:
  test:
    internal: true
