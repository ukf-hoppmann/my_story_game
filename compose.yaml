services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-story_game}
      POSTGRES_USER: ${POSTGRES_USER:-story_game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-story_game_dev}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - story-game-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      STORY_GAME_POSTGRES_DSN: "postgresql://${POSTGRES_USER:-story_game}:${POSTGRES_PASSWORD:-story_game_dev}@postgres:5432/${POSTGRES_DB:-story_game}"
      STORY_GAME_AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./Backend/logs:/app/logs
    command:
      [
        "uvicorn",
        "story_game.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  frontend:
    image: node:${FRONTEND_NODE_TAG:-20-alpine}
    working_dir: /app
    command: npm run dev
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./Frontend-Web:/app:rw
    depends_on:
      - backend

volumes:
  story-game-postgres-data:
