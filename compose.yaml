name: story-game
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-story_game}
      POSTGRES_USER: ${POSTGRES_USER:-story_game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-story_game_dev}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - story-game-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_HOST_PORT:-8081}:8080"
    volumes:
      - ./configs/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships neither curl nor wget; bash's /dev/tcp is the
      # dependency-free way to hit the management health endpoint (see
      # docs/human/operations/keycloak.md for the "keycloak unhealthy" case).
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      STORY_GAME_POSTGRES_DSN: "postgresql://${POSTGRES_USER:-story_game}:${POSTGRES_PASSWORD:-story_game_dev}@postgres:5432/${POSTGRES_DB:-story_game}"
      STORY_GAME_AUTO_MIGRATE: "true"
      # This is the frontend's origin, not the backend's — CORS checks the
      # request's Origin header, which is the caller (frontend), regardless
      # of what domain the backend itself answers on. Fixed on purpose: the
      # nginx proxy always fronts the frontend at this one origin regardless
      # of FRONTEND_HOST_PORT, so this never needs to track that variable.
      # No port suffix — browsers omit the default port (80) from the Origin
      # header, so a ":80" here would never match.
      STORY_GAME_CORS_ALLOWED_ORIGINS: "http://storygame.localhost"
      # The browser reaches Keycloak via nginx (auth.storygame.localhost),
      # so that address — not the compose service name — is what ends up in
      # a token's iss claim, and issuer must match that exactly. Fetching the
      # public keys doesn't need to go through nginx, though: keycloak:8080
      # is reachable directly on the compose network. See
      # docs/human/operations/keycloak.md for why these two are split.
      STORY_GAME_KEYCLOAK_ISSUER: "http://auth.storygame.localhost/realms/story-game"
      STORY_GAME_KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/story-game/protocol/openid-connect/certs"
      STORY_GAME_KEYCLOAK_AUDIENCE: "story-game-frontend"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./Backend/logs:/app/logs
      - ./Backend/configs:/app/configs:ro
    command:
      [
        "uvicorn",
        "story_game.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  frontend:
    image: node:${FRONTEND_NODE_TAG:-20-alpine}
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./Frontend-Web:/app:rw
      - /app/node_modules
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "${PROXY_HOST_PORT:-80}:80"
    volumes:
      - ./configs/nginx/storygame.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  story-game-postgres-data:
