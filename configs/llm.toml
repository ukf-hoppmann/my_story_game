# The single project-owned LLM configuration.
# Replace the three concrete model IDs when the local LM Studio model differs.

[providers.lmstudio]
base_url = "http://host.docker.internal:1234/v1"
timeout_seconds = 60

[task_models]
story = "model.story.default"
extraction = "model.extraction.default"
summary = "model.summary.default"

[[models]]
id = "model.story.default"
task = "story"
provider_id = "lmstudio"
model_id = "mistralai/mistral-small-3.2"

[[models]]
id = "model.extraction.default"
task = "extraction"
provider_id = "lmstudio"
model_id = "mistralai/mistral-small-3.2"

[[models]]
id = "model.summary.default"
task = "summary"
provider_id = "lmstudio"
model_id = "mistralai/mistral-small-3.2"
