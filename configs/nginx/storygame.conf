map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name storygame.localhost;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://backend:8000;
  }

  location = /health {
    proxy_pass http://backend:8000;
  }

  location /docs {
    proxy_pass http://backend:8000;
  }

  location /openapi.json {
    proxy_pass http://backend:8000;
  }

  location /redoc {
    proxy_pass http://backend:8000;
  }

  location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    # nginx does not merge proxy_set_header across nesting levels: once a
    # location defines any of its own, none of the server block's are
    # inherited here. Host must be repeated, or Vite sees "Host: frontend"
    # (the upstream address) instead of the real client host and rejects the
    # request via allowedHosts.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
