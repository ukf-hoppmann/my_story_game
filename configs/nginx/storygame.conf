map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name storygame.localhost;

  location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  server_name backend.storygame.localhost;

  # Long timeout on purpose: suggestion generation goes through the LLM and
  # can take minutes. The LM Studio client itself waits up to
  # STORY_GAME_LMSTUDIO_TIMEOUT_SECONDS (Backend/configs/llm.toml), but
  # nginx's own 60s default would cut the connection first and surface as a
  # 504 Gateway Time-out — keep this at least as long as that backend timeout.
  proxy_read_timeout    600s;
  proxy_send_timeout    600s;
  proxy_connect_timeout 600s;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location / {
    proxy_pass http://backend:8000;
  }
}
